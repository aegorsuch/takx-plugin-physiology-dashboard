workflow:
  rules:
    - if: '$CI_PROJECT_ID == "6850" && $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - if: '$CI_PROJECT_ID == "6850" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

stages:
  - test
  - build
  - publish

release-gate-tests:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s ci -p "test_*.py" -v

takx-check-assemble:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    # build/install finalize native publication; check/assemble do not.
    - sh ./gradlew --no-daemon --console=plain clean check assemble
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - build/libs/
    reports:
      junit: build/test-results/test/TEST-*.xml

personal-github-release:
  stage: publish
  image: python:3.12-alpine
  needs:
    - job: takx-check-assemble
      artifacts: false
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  script:
    - python ci/personal_release_gate.py
